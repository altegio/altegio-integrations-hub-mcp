name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 7 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check runtime version alignment
        run: |
          test "$(sort -u <(sed -nE 's/^FROM node:([0-9.]+)-.*/\1/p' Dockerfile))" = "$(cat .nvmrc)"
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org
      - run: npm run check
      - run: docker build --pull -t altegio-integrations-hub-mcp:ci .
      - name: Scan the runtime image
        run: bash scripts/scan-image.sh altegio-integrations-hub-mcp:ci
      - name: Container smoke
        run: |
          docker run -d --name integrations-hub-mcp --cap-drop=ALL --security-opt=no-new-privileges -p 8094:8094 -e ALTEGIO_PARTNER_TOKEN=test altegio-integrations-hub-mcp:ci
          healthy=
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8094/health && healthy=1 && break; sleep 1; done
          docker exec integrations-hub-mcp sh -ec 'test "$(id -u)" = 1001; ! command -v npm; ! command -v yarn; test -w /data'
          node scripts/smoke-http.mjs http://127.0.0.1:8094/mcp
          # A deploy stops the container with SIGTERM; the restart alert reads the stop line.
          docker stop integrations-hub-mcp
          logs=$(docker logs integrations-hub-mcp 2>&1)
          printf '%s\n' "$logs"
          test -n "$healthy"
          grep -q 'Received SIGTERM, shutting down' <<< "$logs"
          test "$(docker inspect -f '{{.State.ExitCode}}' integrations-hub-mcp)" = 0
