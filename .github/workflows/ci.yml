name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: docker build -t altegio-integrations-hub-mcp:ci .
      - name: Container smoke
        run: |
          docker run -d --name integrations-hub-mcp -p 8094:8094 -e ALTEGIO_PARTNER_TOKEN=test altegio-integrations-hub-mcp:ci
          healthy=
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8094/health && healthy=1 && break; sleep 1; done
          # A deploy stops the container with SIGTERM; the restart alert reads the stop line.
          docker stop integrations-hub-mcp
          logs=$(docker logs integrations-hub-mcp 2>&1)
          printf '%s\n' "$logs"
          test -n "$healthy"
          grep -q 'Received SIGTERM, shutting down' <<< "$logs"
          test "$(docker inspect -f '{{.State.ExitCode}}' integrations-hub-mcp)" = 0
