name: Bug report
description: Report a reproducible MCP behavior problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: For vulnerabilities use SECURITY.md. Do not include tokens, private specifications or customer payloads.
  - type: input
    id: version
    attributes:
      label: Revision and environment
      description: Git revision, Node/npm versions and stdio or HTTP client.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Steps, expected result and actual result. Keep live mutations out of the reproduction.
    validations:
      required: true
